services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    ports:
      - "8096:8096"
      - "8920:8920"
    volumes:
      - /home/server/jellyfin/config:/config
      - /home/server/jellyfin/cache:/cache
      - type: bind
        source: /home/server/pinchflat/downloads
        target: /media
      - type: bind
        source: /mnt/heather_drive/arr_data/sonarr/data/tv
        target: /tv
      - type: bind
        source: /mnt/heather_drive/arr_data/sonarr/data/shame
        target: /shame
      # Optional - extra fonts to be used during transcoding with subtitle burn-in
    restart: 'unless-stopped'
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - 'host.docker.internal:host-gateway'
