services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /mnt/heather_drive/arr_data/sonarr/data:/config
      - /mnt/heather_drive/arr_data/files:/files
    ports:
      - 8989:8989
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - DOTNET_SYSTEM_NET_DISABLEIPV6=true
    ports:
      - 9696:9696
    volumes:
      - /mnt/heather_drive/arr_data/prowlarr/data:/config
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
